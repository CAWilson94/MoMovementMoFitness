name: Update Strava activity data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          START_DATE: "2026-08-10"
          END_DATE: "2026-10-25"
        run: node scripts/fetch-strava.mjs

      - name: Commit updated activity data
        id: commit
        run: |
          git config user.name "strava-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-activities.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update activity data from Strava"
            git push
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.data_changed == 'true'
    uses: ./.github/workflows/static.yml
